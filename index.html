    <!-- Expose tomtom/tt aliases for compatibility with different SDK versions -->
    <script>
      (function aliasTomTomGlobals(){
        function setAliases(){
          if (window.tt && !window.tomtom) window.tomtom = window.tt;
          if (window.tomtom && !window.tt) window.tt = window.tomtom;
        }
        // Run now and shortly after to cover delayed SDK init
        setAliases();
        setTimeout(setAliases, 250);
        setTimeout(setAliases, 1000);
        // Optional debug log
        console.debug('TomTom SDK globals:', { tt: !!window.tt, tomtom: !!window.tomtom });
      })();
    </script>
